<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enzi Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <header class="top">
      <div class="logo"><i></i><i></i></div>
      <div>
        <h1>Enzi</h1>
        <p>Turn features on or off and set them up the way you like. Changes apply instantly.</p>
      </div>
    </header>
    <div id="form"></div>
    <footer>
      <div class="foot-actions">
        <button id="open-data">Open data folder</button>
        <button id="reset">Reset to defaults</button>
        <button id="quit" class="danger">Quit Enzi</button>
      </div>
      <p class="note">Lyrics provided by LRCLIB (lrclib.net). Enzi only watches the volume keys, Caps Lock and language shortcuts; it never records what you type.</p>
      <p class="status" id="status"></p>
    </footer>
  </main>
  <script src="shared.js"></script>
  <script src="settings.js"></script>
</body>
</html>
