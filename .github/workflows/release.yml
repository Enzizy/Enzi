# Builds the Windows installer and publishes a GitHub Release.
# Runs when a version tag like v1.0.1 is pushed, or manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match version $version in src-tauri/tauri.conf.json. Update the version there, or push tag v$version."
            exit 1
          }

      # Fails fast with a readable message instead of after the 5-minute build. Never prints the key.
      - name: Check the update signing key
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $fail = { param($msg) Write-Output "::error title=Signing key::$msg"; exit 1 }
          if (-not $env:KEY) { & $fail "The TAURI_SIGNING_PRIVATE_KEY secret is missing or empty. Add it under Settings > Secrets and variables > Actions > Repository secrets." }
          try { $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:KEY.Trim())) }
          catch { & $fail "TAURI_SIGNING_PRIVATE_KEY isn't the key file's contents: paste everything inside enzi-updater.key, with nothing added." }
          if ($text -match "public key") { & $fail "TAURI_SIGNING_PRIVATE_KEY holds the public key (enzi-updater.key.pub). Paste the contents of enzi-updater.key instead." }
          if ($text -notmatch "secret key") { & $fail "TAURI_SIGNING_PRIVATE_KEY doesn't look like a Tauri signing key. Paste the contents of enzi-updater.key." }
          Write-Output "Signing key found."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed copies of Enzi can trust it (see README → Releasing).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: v__VERSION__
          releaseName: Enzi v__VERSION__
          releaseBody: |
            Download **Enzi_*_x64-setup.exe** below and run it.

            The installer isn't code-signed, so Windows may show "Windows protected your PC". Click **More info**, then **Run anyway**.
          releaseDraft: false
          prerelease: false
