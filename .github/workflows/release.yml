# Builds the Windows installer and publishes a GitHub Release.
# Runs when a version tag like v1.0.1 is pushed, or manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match version $version in src-tauri/tauri.conf.json. Update the version there, or push tag v$version."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Enzi v__VERSION__
          releaseBody: |
            Download **Enzi_*_x64-setup.exe** below and run it.

            The installer isn't code-signed, so Windows may show "Windows protected your PC". Click **More info**, then **Run anyway**.
          releaseDraft: false
          prerelease: false
